# Core
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g default-shell /usr/bin/fish
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi
set -g history-limit 1000000
set -g display-time 3000
set -g visual-activity off
set -g allow-passthrough on

# Bindings
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind -r C-p previous-window
bind -r C-n next-window
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n C-M-h previous-window
bind -n C-M-l next-window
bind S command-prompt -p "New session:" "new-session -s '%%'"
bind Q confirm-before "kill-session"
bind v split-window -v -c "#{pane_current_path}"
bind | split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind q kill-pane
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind-key -T prefix t set-option -g status

# Vim Integration
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)n?vim$' && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)n?vim$' && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)n?vim$' && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)n?vim$' && tmux send-keys C-l) || tmux select-pane -R"

# Visuals (Deep Dark & Transparent)
set -g status-interval 2
set -g status-justify left
set -g status-position bottom
set -g status-style bg=default,fg="#e0def4"
set -g pane-border-style fg="#191924",bg=default
set -g pane-active-border-style fg="#403d52",bg=default
set -g message-style bg=default,fg="#f6c177"
set -g message-command-style bg=default,fg="#f6c177"
set -g mode-style bg="#403d52",fg="#e0def4"

# Status Bar
set -g status-left-length 100
set -g status-left "#[fg=#f6c177,bold] 󰣇 #S #[fg=#403d52]│ "
set -g status-right-length 100
set -g status-right "#[fg=#9ccfd8]   #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} #[fg=#403d52]│#[fg=#c4a7e7] 󰃰 %H:%M "
set -g window-status-separator ""
set -g window-status-format "#[fg=#403d52]  #I #W  "
set -g window-status-current-format "#[fg=#d7827e,bold]  #I #W  "

# Windows
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_command}"
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
