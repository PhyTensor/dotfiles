# Example windowrule v1
# windowrule = float, ^(kitty)$

windowrule = workspace special, class:obsidian
windowrule = workspace 6, class:Spotify
windowrule = workspace 8, class:steam
windowrule = workspace 9, class:Godot
windowrule = tile,class:^(steam)$
windowrule = tile,class:^(Godot)$
windowrule = tile,class:^(Godot_Editor)$
# windowrule = tile,class:^(code)$
windowrule = tile,class:^(Google-chrome)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# rules below would make the specific app transparent
windowrulev2 = opacity 0.8 0.8,class:^(obsidian)$
windowrulev2 = animation popin,class:^(wofi)$
# windowrulev2 = noanim,class:^(wofi)$

